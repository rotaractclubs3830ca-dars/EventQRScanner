<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Event QR Attendance Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6fa;
  font-family:Arial,sans-serif;
  color:#17365d;
  padding:12px;
}

.wrap{
  max-width:540px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 5px 20px #0002;
}

h1{
  text-align:center;
  font-size:22px;
  margin:4px 0;
}

h2{
  text-align:center;
  font-size:14px;
  margin:6px 0 16px;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#000;
}

#reader video{
  width:100% !important;
  object-fit:cover !important;
}

button,
input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:11px;
  font-size:16px;
}

button{
  border:0;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#17365d;
  color:white;
}

.secondary{
  background:#e8eef6;
  color:#17365d;
}

.next{
  background:#176b2c;
  color:white;
  font-size:17px;
}

.stop{
  background:#8d2020;
  color:white;
}

input{
  border:1px solid #bbb;
  background:white;
}

.controls{
  display:none;
  gap:8px;
  margin-top:10px;
}

.controls button{
  margin-top:0;
  flex:1;
}

.result{
  display:none;
  margin:10px 0 12px;
  padding:16px;
  border-radius:12px;
  text-align:center;
  line-height:1.55;

  position:sticky;
  top:8px;
  z-index:50;

  box-shadow:0 4px 14px #0002;
}

.info{
  display:block;
  background:#e7eff8;
  color:#17365d;
}

.success{
  display:block;
  background:#dff3e4;
  color:#176b2c;
}

.duplicate{
  display:block;
  background:#fff3cd;
  color:#725000;
}

.payment{
  display:block;
  background:#fde5e5;
  color:#9b0000;
}

.error{
  display:block;
  background:#fde5e5;
  color:#9b0000;
}

.name{
  font-size:24px;
  font-weight:700;
  margin:8px 0;
}

.guest-id{
  font-size:15px;
  margin-bottom:5px;
}

.details{
  margin-top:8px;
  line-height:1.7;
}

.payment-stop{
  font-size:22px;
  font-weight:900;
  margin-bottom:8px;
}

.payment-instruction{
  font-size:17px;
  font-weight:700;
  margin-top:10px;
}

.manual{
  border-top:1px solid #ddd;
  margin-top:18px;
  padding-top:16px;
}

.small{
  font-size:13px;
  line-height:1.5;
  color:#667;
}

.debug{
  font-size:11px;
  color:#777;
  word-break:break-word;
  margin-top:8px;
}

@media(max-width:600px){

  body{
    padding:6px;
  }

  .wrap{
    max-width:100%;
  }

  .card{
    padding:10px;
    border-radius:14px;
  }

  h1{
    font-size:18px;
    margin:2px 0;
  }

  h2{
    font-size:12px;
    margin:3px 0 8px;
  }

  /* RESULT BOX */
  .result{
    margin:6px 0 7px;
    padding:10px;
    font-size:14px;
    line-height:1.35;
    border-radius:10px;

    position:sticky;
    top:4px;
    z-index:50;
  }

  .name{
    font-size:21px;
    margin:5px 0;
  }

  .guest-id{
    margin-bottom:3px;
  }

  .details{
    margin-top:4px;
    line-height:1.45;
  }

  .payment-stop{
    font-size:19px;
    margin-bottom:5px;
  }

  .payment-instruction{
    font-size:15px;
    margin-top:6px;
  }

  /* SCAN NEXT PLAYER */
  #nextBtn{
    margin-top:6px;
    margin-bottom:6px;
    padding:12px;
    font-size:16px;
  }

  /* CAMERA */
 #reader{
  width:100%;
  max-height:34vh;
  border-radius:10px;
}

#reader video{
  width:100% !important;
  height:34vh !important;
  max-height:34vh !important;
  object-fit:cover !important;
}

  /* CAMERA BUTTONS */
  .controls{
    display:none;
    gap:6px;
    margin-top:6px;
  }

  .controls button{
    flex:1;
    width:auto;
    margin-top:0;
    padding:10px 6px;
    font-size:13px;
  }

  /* MANUAL BACKUP */
  .manual{
    margin-top:10px;
    padding-top:10px;
  }

  .manual input{
    padding:11px;
    margin-top:7px;
  }

  .manual button{
    padding:11px;
    margin-top:7px;
  }

  .small{
    font-size:12px;
  }

  .debug{
    font-size:10px;
    margin-top:4px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>WELCOME TO THE EVENT</h1>
    <h1>PLEASE SCAN YOUR QR HERE</h1>

    <!-- RESULT IS ABOVE CAMERA -->
    <div id="result" class="result"></div>

    <div id="debug" class="debug"></div>

    <!-- NEXT PLAYER -->
    <button
      id="nextBtn"
      class="next"
      style="display:none"
      onclick="scanNextPlayer()">
      ▶ SCAN NEXT PLAYER
    </button>

    <!-- CAMERA -->
    <div id="reader"></div>

    <button
      id="startBtn"
      class="primary"
      onclick="startCamera()">
      📷 START CAMERA
    </button>

    <div
      id="controls"
      class="controls">

      <button
        id="switchBtn"
        class="secondary"
        onclick="switchCamera()">
        🔄 SWITCH CAMERA
      </button>

      <button
        class="stop"
        onclick="stopCamera()">
        ■ STOP CAMERA
      </button>

    </div>

    <!-- MANUAL BACKUP -->
    <div class="manual">

      <b>Backup Check-In</b>

      <div class="small">
        Enter the QR / Guest ID if camera scanning is unavailable.
      </div>

      <input
        id="manualCode"
        placeholder="EVT-0001"
        autocomplete="off"
        onkeydown="if(event.key==='Enter')manualCheckIn()">

      <button
        class="secondary"
        onclick="manualCheckIn()">
        CHECK IN PLAYER
      </button>

    </div>

  </div>

</div>


<script>

/*************************************************
 * SYSTEM CONFIGURATION
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyOetfDjK8K__uXL-D8e6KFR9bDU62H8GXvy6v03Ianfdmd97qLAZvrNQq_MYBh-s0/exec";

const SCANNER_KEY =
  "DarsAttendanceFile";


/*************************************************
 * VARIABLES
 *************************************************/

let qr = null;

let cameras = [];

let current = 0;

let busy = false;

let lastCode = "";

let lastTime = 0;

let pausedForResult = false;

const NOTICE_DURATION_MS = 20000;
let noticeTimer = null;
let noticeGeneration = 0;

function cancelNoticeTimer(){
  clearTimeout(noticeTimer);
  noticeTimer = null;
  noticeGeneration++;
}

function scheduleNoticeDismissal(){
  cancelNoticeTimer();
  const generation = noticeGeneration;
  noticeTimer = setTimeout(function(){
    if(generation !== noticeGeneration || busy) return;
    const result = document.getElementById("result");
    result.style.display = "none";
    result.innerHTML = "";
    if(pausedForResult && qr && qr.isScanning){
      scanNextPlayer();
      result.style.display = "none";
    }
  }, NOTICE_DURATION_MS);
}



/*************************************************
 * RESULT MESSAGE
 *************************************************/

function setResult(type,html){
  cancelNoticeTimer();

  const result =
    document.getElementById("result");

  result.className =
    "result " + type;

  result.innerHTML =
    html;

  result.style.display =
    "block";
}


/*************************************************
 * SAFE HTML
 *************************************************/

function esc(value){

  return String(
    value == null
      ? ""
      : value
  ).replace(
    /[&<>"']/g,
    function(character){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[character];

    }
  );
}


/*************************************************
 * SOUND
 *************************************************/

function tone(success){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const context =
      new AudioContext();

    const oscillator =
      context.createOscillator();

    const gain =
      context.createGain();

    oscillator.connect(gain);

    gain.connect(
      context.destination
    );

    oscillator.frequency.value =
      success
        ? 880
        : 240;

    gain.gain.setValueAtTime(
      0.10,
      context.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      context.currentTime + 0.18
    );

    oscillator.start();

    oscillator.stop(
      context.currentTime + 0.18
    );

  }catch(error){}

}


/*************************************************
 * START CAMERA
 *************************************************/

async function startCamera(){

  document
    .getElementById("debug")
    .textContent = "";

  document
    .getElementById("nextBtn")
    .style.display = "none";

  pausedForResult = false;

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    cameraError(
      new Error(
        "Camera API is not supported by this browser."
      )
    );

    return;
  }

  try{

    setResult(
      "info",
      "Requesting camera permission..."
    );

    /*
     * Request camera permission first.
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          video:true,
          audio:false
        });

    stream
      .getTracks()
      .forEach(function(track){
        track.stop();
      });


    /*
     * Find cameras.
     */

    cameras =
      await Html5Qrcode.getCameras();

    cameras =
      cameras || [];

    if(!cameras.length){

      throw new Error(
        "No camera detected."
      );
    }


    /*
     * Prefer rear camera.
     */

    const rear =
      cameras.findIndex(
        function(camera){

          return /back|rear|environment|world/i
            .test(
              camera.label || ""
            );
        }
      );

    current =
      rear >= 0
        ? rear
        : (
            cameras.length > 1
              ? cameras.length - 1
              : 0
          );

    fillCameraControls();

    await openCamera();

  }catch(error){

    cameraError(error);
  }
}


/*************************************************
 * CAMERA CONTROLS
 *************************************************/

function fillCameraControls(){

  const controls =
    document.getElementById(
      "controls"
    );

  const switchButton =
    document.getElementById(
      "switchBtn"
    );

  controls.style.display =
    cameras.length
      ? "flex"
      : "none";

  switchButton.style.display =
    cameras.length > 1
      ? "block"
      : "none";
}


/*************************************************
 * OPEN CAMERA
 *************************************************/

async function openCamera(){

  try{

    document
      .getElementById("nextBtn")
      .style.display = "none";

    pausedForResult = false;


    /*
     * Stop existing camera.
     */

    if(qr){

      try{

        if(qr.isScanning){
          await qr.stop();
        }

      }catch(error){}

      try{
        qr.clear();
      }catch(error){}
    }


    qr =
      new Html5Qrcode(
        "reader"
      );


    const camera =
      cameras[current];

    if(!camera){

      throw new Error(
        "Selected camera is unavailable."
      );
    }


    setResult(
      "info",
      "Opening " +
      esc(
        camera.label ||
        "camera"
      ) +
      "..."
    );


    await qr.start(

      camera.id,

      {
        fps:10,

        qrbox:function(
          width,
          height
        ){

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );

          return {
            width:size,
            height:size
          };
        },

        aspectRatio:1
      },

      function(decodedText){

        checkPlayer(
          decodedText,
          true
        );
      },

      function(){
        /*
         * Ignore normal
         * QR-not-found messages.
         */
      }
    );


    document
  .getElementById("startBtn")
  .style.display =
    "none";


document
  .getElementById("controls")
  .style.display =
    "flex";


/*
 * Clear any old camera error message
 * after camera opens successfully.
 */
document
  .getElementById("debug")
  .textContent = "";


setResult(
  "info",
  "Camera ready — scan a player QR code."
);

  }catch(error){

    cameraError(error);
  }
}


/*************************************************
 * SWITCH CAMERA
 *************************************************/

async function switchCamera(){

  if(cameras.length < 2){
    return;
  }

  current =
    (
      current + 1
    ) %
    cameras.length;

  fillCameraControls();

  await openCamera();
}


/*************************************************
 * STOP CAMERA
 *************************************************/

async function stopCamera(){

  document
    .getElementById("nextBtn")
    .style.display =
      "none";

  pausedForResult = false;

  try{

    if(
      qr &&
      qr.isScanning
    ){

      await qr.stop();
    }

    if(qr){
      qr.clear();
    }

  }catch(error){}

  qr = null;

  document
    .getElementById("startBtn")
    .style.display =
      "block";

  document
    .getElementById("controls")
    .style.display =
      "none";

  setResult(
    "info",
    "Camera stopped."
  );
}


/*************************************************
 * MANUAL CHECK-IN
 *************************************************/

function manualCheckIn(){

  const input =
    document.getElementById(
      "manualCode"
    );

  const value =
    input.value.trim();

  if(!value){

    setResult(
      "error",
      "<b>Enter a QR / Guest ID.</b>"
    );

    return;
  }

  input.value = "";

  checkPlayer(
    value,
    false
  );
}


/*************************************************
 * CHECK PLAYER
 *************************************************/

function checkPlayer(
  raw,
  fromQr = false
){

  const code =
    String(
      raw || ""
    )
    .trim()
    .toUpperCase();

  if(!code){
    return;
  }


  const now =
    Date.now();


  /*
   * Ignore requests while server
   * lookup is already running.
   */

  if(busy){
    return;
  }


  /*
   * Extra duplicate protection.
   */

  if(
    code === lastCode &&
    now - lastTime < 3500
  ){
    return;
  }


  /*
   * Verify configuration.
   */

  if(!SCANNER_KEY){

    setResult(
      "error",
      "<b>SCANNER KEY NOT CONFIGURED.</b>"
    );

    return;
  }

  if(!API_URL){

    setResult(
      "error",
      "<b>ATTENDANCE SERVER NOT CONFIGURED.</b>"
    );

    return;
  }


  busy = true;

  lastCode = code;

  lastTime = now;


  /*
   * QR CAMERA:
   * Pause immediately after ONE QR.
   */

  if(fromQr){

    pausedForResult = true;

    try{

      if(
        qr &&
        qr.isScanning
      ){

        qr.pause(true);
      }

    }catch(error){}
  }


  if(navigator.vibrate){

    navigator.vibrate(
      80
    );
  }


  document
    .getElementById("nextBtn")
    .style.display =
      "none";


  setResult(
    "info",
    "Checking " +
    esc(code) +
    "..."
  );


  /*
   * JSONP CALLBACK
   */

  const callback =
    "attendance_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let timer =
    setTimeout(
      function(){

        finishError(
          "Attendance server did not respond."
        );

      },
      30000
    );


  function cleanup(){

    clearTimeout(
      timer
    );

    try{
      delete window[
        callback
      ];
    }catch(error){}

    if(script.parentNode){
      script.remove();
    }
  }


  function finishError(message){

    cleanup();

    busy = false;

    setResult(
      "error",
      "<b>CONNECTION ERROR</b><br>" +
      esc(message)
    );

    showNextButtonIfPaused();
    scheduleNoticeDismissal();
  }


  window[callback] =
    function(data){

      cleanup();

      displayResult(
        data || {
          ok:false,
          message:
            "Invalid server response."
        }
      );
    };


  script.onerror =
    function(){

      finishError(
        "Could not confirm the server response. Check the registration sheet before retrying."
      );
    };


  const params =
    new URLSearchParams({

      action:
        "checkin",

      code:
        code,

      device:
        "GitHub QR Scanner",

      key:
        SCANNER_KEY,

      callback:
        callback
    });


  script.src =
    API_URL +
    "?" +
    params.toString();


  document.body
    .appendChild(
      script
    );
}


/*************************************************
 * DISPLAY RESULT
 *************************************************/

function displayResult(data){

  /*
   * SUCCESS
   */

  if(data.ok){

    tone(true);

    let location = "";

    if(
      data.table ||
      data.seat
    ){

      location =
        "<div class='details'>" +

        (
          data.table
            ? "<b>TABLE:</b> " +
              esc(data.table)
            : ""
        ) +

        (
          data.table &&
          data.seat
            ? " &nbsp; | &nbsp; "
            : ""
        ) +

        (
          data.seat
            ? "<b>SEAT:</b> " +
              esc(data.seat)
            : ""
        ) +

        "</div>";
    }


    setResult(

      "success",

      "<b>✅ " +
      esc(
        data.message ||
        "CHECK-IN SUCCESSFUL"
      ) +
      "</b>" +

      "<div class='name'>" +
      esc(
        data.name || ""
      ) +
      "</div>" +

      "<div class='guest-id'>" +
      "<b>GUEST ID:</b> " +
      esc(
        data.id || ""
      ) +
      "</div>" +

      "<b>PAYMENT:</b> " +
      esc(
        data.payment ||
        "N/A"
      ) +

      location +

      "<div class='details'>" +
      "<b>CHECK-IN:</b> " +
      esc(
        data.time || ""
      ) +
      "</div>"
    );


    if(navigator.vibrate){

      navigator.vibrate(
        [100,70,100]
      );
    }
  }


  /*
   * PAYMENT REQUIRED
   */

  else if(
    data.status ===
      "payment_required" ||
    data.status ===
      "unpaid"
  ){

    tone(false);

    setResult(

      "payment",

      "<div class='payment-stop'>" +
      "⛔ NOT CHECKED IN" +
      "</div>" +

      "<div class='name'>" +
      esc(
        data.name || ""
      ) +
      "</div>" +

      "<div class='guest-id'>" +
      "<b>GUEST ID:</b> " +
      esc(
        data.id || ""
      ) +
      "</div>" +

      "<br><b>PAYMENT STATUS:</b> " +
      esc(
        data.payment ||
        "UNPAID"
      ) +

      "<div class='payment-instruction'>" +
(
  String(data.payment || "").trim().toUpperCase() === "N/A"
    ? "Please proceed to the REGISTRATION AREA for verification."
    : "Please proceed to the PAYMENT AREA first."
) +
"</div>" +

"<div class='details'>" +
(
  String(data.payment || "").trim().toUpperCase() === "N/A"
    ? "After registration verification, scan the QR code again."
    : "After payment is confirmed, scan the QR code again."
) +
"</div>"
    );


    if(navigator.vibrate){

      navigator.vibrate(
        [250,100,250]
      );
    }
  }


  /*
   * DUPLICATE
   */

  else if(
    data.status ===
      "duplicate"
  ){

    tone(false);

    setResult(

      "duplicate",

      "<b>⚠️ ALREADY CHECKED IN</b>" +

      "<div class='name'>" +
      esc(
        data.name || ""
      ) +
      "</div>" +

      "<div class='guest-id'>" +
      "<b>GUEST ID:</b> " +
      esc(
        data.id || ""
      ) +
      "</div>" +

      "<br><b>PAYMENT:</b> " +
      esc(
        data.payment ||
        "N/A"
      ) +

      (
        data.table
          ? "<br><b>TABLE:</b> " +
            esc(data.table)
          : ""
      ) +

      (
        data.seat
          ? " &nbsp; | &nbsp; " +
            "<b>SEAT:</b> " +
            esc(data.seat)
          : ""
      ) +

      "<br><b>FIRST CHECK-IN:</b> " +
      esc(
        data.firstCheckIn ||
        ""
      )
    );


    if(navigator.vibrate){

      navigator.vibrate(
        [180,80,180]
      );
    }
  }


  /*
   * UNAUTHORIZED
   */

  else if(
    data.status ===
      "unauthorized"
  ){

    tone(false);

    setResult(

      "error",

      "<b>⛔ UNAUTHORIZED SCANNER</b>" +
      "<br>Please check the scanner key."
    );
  }


  /*
   * OTHER ERROR
   */

  else{

    tone(false);

    setResult(

      "error",

      "<b>❌ " +
      esc(
        data.message ||
        "CHECK-IN FAILED"
      ) +
      "</b>" +

      (
        data.name
          ? "<div class='name'>" +
            esc(data.name) +
            "</div>"
          : ""
      ) +

      (
        data.id
          ? "<br>" +
            esc(data.id)
          : ""
      )
    );
  }


  /*
   * Request finished.
   */

  busy = false;

  showNextButtonIfPaused();
  scheduleNoticeDismissal();
}


/*************************************************
 * SHOW NEXT BUTTON
 *************************************************/

function showNextButtonIfPaused(){

  const next =
    document.getElementById(
      "nextBtn"
    );

  if(
    pausedForResult &&
    qr &&
    qr.isScanning
  ){

    next.style.display =
      "block";

  }else{

    next.style.display =
      "none";
  }
}


/*************************************************
 * SCAN NEXT PLAYER
 *************************************************/

function scanNextPlayer(){
  cancelNoticeTimer();

  /*
   * Reset duplicate lock so the
   * operator can intentionally scan
   * another QR.
   */

  lastCode = "";

  lastTime = 0;

  busy = false;


  document
    .getElementById("nextBtn")
    .style.display =
      "none";


  try{

    if(
      qr &&
      qr.isScanning
    ){

      qr.resume();

      pausedForResult =
        false;

      setResult(
        "info",
        "Camera ready — scan the next player QR code."
      );

    }else{

      pausedForResult =
        false;

      setResult(
        "info",
        "Press START CAMERA to scan the next player."
      );

      document
        .getElementById("startBtn")
        .style.display =
          "block";
    }

  }catch(error){

    pausedForResult =
      false;

    setResult(
      "error",
      "<b>CAMERA ERROR</b><br>" +
      "Could not resume camera. Press START CAMERA."
    );

    document
      .getElementById("startBtn")
      .style.display =
        "block";
  }
}


/*************************************************
 * CAMERA ERROR
 *************************************************/

function cameraError(error){

  const name =
    error &&
    error.name
      ? error.name
      : "";

  const message =
    error &&
    error.message
      ? error.message
      : String(error);

  let help =
    "Press START CAMERA again or use manual check-in.";


  if(
    name ===
      "NotAllowedError" ||
    /permission|denied/i
      .test(message)
  ){

    help =
      "Camera permission was denied. Allow camera access for this website and press START CAMERA again.";
  }

  else if(
    name ===
      "NotFoundError"
  ){

    help =
      "No camera was found on this device.";
  }

  else if(
    name ===
      "NotReadableError"
  ){

    help =
      "The camera may already be in use by another app. Close the other app and try again.";
  }


  setResult(

    "error",

    "<b>CAMERA ERROR</b><br>" +
    esc(help)
  );


  document
    .getElementById(
      "debug"
    )
    .textContent =
      "Browser error: " +
      name +
      " — " +
      message;


  document
    .getElementById(
      "startBtn"
    )
    .style.display =
      "block";
}


/*************************************************
 * INITIAL CHECK
 *************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(!SCANNER_KEY){

      setResult(
        "error",
        "<b>SCANNER KEY NOT CONFIGURED.</b>"
      );

      return;
    }

    if(!API_URL){

      setResult(
        "error",
        "<b>ATTENDANCE SERVER NOT CONFIGURED.</b>"
      );

      return;
    }

  }
);

</script>
